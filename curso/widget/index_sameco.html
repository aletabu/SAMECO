<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMI — Asistente SAMECO</title>
<style>
  :root {
    --violeta: #7c3aed;
    --tinta: #1f2937;
    --gris: #6b7280;
    --panel: #f3f4f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--tinta);
    background: #fff;
    display: flex;
    flex-direction: column;
    padding: .75rem;
    gap: .6rem;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 10px;
    padding: .8rem;
    display: flex;
    flex-direction: column;
    gap: .55rem;
    font-size: .92rem;
  }
  .msg { max-width: 85%; padding: .55rem .8rem; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--violeta); color: #fff; }
  .msg.bot { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; white-space: normal; }
  .msg.bot p { margin: .35rem 0; }
  .msg.bot ul { margin: .35rem 0; padding-left: 1.2rem; }
  .msg.bot li { margin: .15rem 0; }
  .msg.bot a { color: var(--violeta); font-weight: 600; word-break: break-all; }
  .msg.bot .fuentes { display: block; margin-top: .4rem; font-size: .75rem; color: var(--gris); }
  .fila-input { display: flex; gap: .5rem; }
  #msg {
    flex: 1;
    padding: .8rem 1rem;
    font-size: 1rem;
    border: 2px solid var(--violeta);
    border-radius: 999px;
  }
  #enviar {
    padding: 0 1.2rem;
    border: 0;
    border-radius: 999px;
    background: var(--violeta);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="chat"></div>
<div class="fila-input">
  <input id="msg" placeholder="Escribile a SAMI…" autocomplete="off" />
  <button id="enviar">➤</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const boton = document.getElementById("enviar");
const mensajes = [];
// Identificador de este visitante (para que el server le dé su propia sesión)
const cliente = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

// Markdown mínimo y seguro: escapa HTML y convierte negritas, links y listas.
function md(texto) {
  const esc = texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const linea = (s) => s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const html = [];
  let lista = false;
  for (const l of esc.split("\n")) {
    const item = l.match(/^\s*[*-]\s+(.*)$/);
    if (item) {
      if (!lista) { html.push("<ul>"); lista = true; }
      html.push("<li>" + linea(item[1]) + "</li>");
    } else {
      if (lista) { html.push("</ul>"); lista = false; }
      if (l.trim()) html.push("<p>" + linea(l) + "</p>");
    }
  }
  if (lista) html.push("</ul>");
  return html.join("");
}

function pintar(rol, texto, fuentes) {
  const div = document.createElement("div");
  div.className = "msg " + (rol === "user" ? "user" : "bot");
  if (rol === "user") div.textContent = texto;
  else div.innerHTML = md(texto);
  if (fuentes && fuentes.length) {
    const f = document.createElement("span");
    f.className = "fuentes";
    f.textContent = "Fuentes: " + fuentes.join(" · ");
    div.appendChild(f);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function enviar() {
  const texto = input.value.trim();
  if (!texto) return;
  input.value = "";
  mensajes.push({ rol: "user", texto });
  pintar("user", texto);
  pintar("bot", "…");
  const espera = chat.lastChild;
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensajes, cliente }),
    });
    const data = await r.json();
    espera.remove();
    mensajes.push({ rol: "bot", texto: data.texto });
    pintar("bot", data.texto, data.fuentes);
  } catch (e) {
    espera.textContent = "[No pude contactar al asistente — probá de nuevo en un momento]";
  }
}

boton.addEventListener("click", enviar);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") enviar(); });
pintar("bot", "¡Hola! Soy SAMI, el asistente de SAMECO. Preguntame por el Encuentro 2026 o por los trabajos del archivo.");
</script>

</body>
</html>
